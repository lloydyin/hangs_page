<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PSV Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@3.0.6/dist/photo-sphere-viewer.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #viewer {
            width: 1000px;
            height: 500px;
            margin: 50px auto;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Photo Sphere Viewer Test</h2>
<div id="viewer"></div>

<!-- 先加载 Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.126.1/build/three.min.js"></script>
<!-- 再加载 Photo Sphere Viewer UMD -->
<script src="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@3.0.6/dist/photo-sphere-viewer.js"></script>

<script>
    window.onload = function() {
        const viewer = new PhotoSphereViewer.Viewer({
            container: document.getElementById('viewer'),
            panorama: 'CRall_20241217_044252077.PHOTOSPHERE.png',
            navbar: ['zoom', 'fullscreen']
        });
    };
</script>

</body>
</html>
